<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liên lạc // Thiết bị của Xavier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#05040f;--line:#5b4bd6;--line2:#1b1548;--dim:#7f77b8;--text:#fff;--tick:#a99cff;--amber:#e8c46a;
--head:"Chakra Petch",system-ui,sans-serif;--sans:"Space Grotesk",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05040f}}
:root[data-theme="dark"]{--bg:#05040f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;background-image:radial-gradient(1px 1px at 12% 20%,#fff5,transparent),radial-gradient(1px 1px at 70% 12%,#fff4,transparent),radial-gradient(1px 1px at 86% 60%,#fff4,transparent),radial-gradient(1px 1px at 30% 80%,#fff3,transparent)}
.hd{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(5,4,15,.72);border-bottom:1px solid var(--line2)}
.in{max-width:1306px;margin:0 auto;padding:0 24px;height:62px;display:flex;align-items:center;padding-top:env(safe-area-inset-top,0px);font:400 12px var(--mono);letter-spacing:.24em;color:var(--dim);white-space:nowrap;overflow:hidden}
.in b{color:var(--text)}.in i{font-style:normal;color:var(--line);margin:0 14px}
.en{position:fixed;z-index:25;top:calc(11px + env(safe-area-inset-top,0px));right:57px;font:700 12px var(--mono);letter-spacing:.14em;background:var(--bg);border:1px solid #3a3270;padding:12px 16px}
.wrap{max-width:1306px;margin:0 auto;padding:130px 24px 8vh}
h1.t{font:700 clamp(36px,5vw,54px) var(--head);line-height:1.1}
.sub{margin-top:14px;font:400 17px var(--sans);color:var(--dim);min-height:1.6em}
.cur{display:inline-block;width:8px;height:15px;background:var(--line);vertical-align:-2px;margin-left:5px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.lab{font:400 11px var(--mono);letter-spacing:.18em;color:var(--dim);white-space:nowrap}
.pill{font:700 11px var(--mono);letter-spacing:.1em;color:var(--amber);border:1px solid #9c8344;padding:3px 7px;white-space:nowrap}
.btn{font:700 12px var(--mono);letter-spacing:.16em;color:var(--text);background:var(--bg);border:1px solid #3a3270;padding:12px 18px;cursor:pointer}.btn:hover{border-color:var(--line)}
.tk{position:relative}
.tk::before{content:"";position:absolute;left:-1px;top:-1px;width:7px;height:7px;border:solid var(--tick);border-width:1px 0 0 1px;z-index:3}
.tk::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border:solid var(--tick);border-width:0 1px 1px 0;z-index:3}
.tb{height:22px;text-align:center;border-bottom:1px solid var(--line);background:repeating-conic-gradient(#2b2178 0 25%,transparent 0 50%) 0 0/4px 4px}
.tb span{display:inline-block;height:100%;background:var(--bg);padding:0 12px;font:700 11px/21px var(--mono);letter-spacing:.14em}
.mn{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;background:var(--tick);box-shadow:var(--sh,inset -5px 0 0 #05040f);border:1px solid var(--tick)}
/* layout: cả trang là màn hình của thiết bị */
#con,#denied{display:none}
#con{position:relative}
.wpm{position:absolute;right:2%;top:60px;width:min(50vw,580px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 2px 2px,var(--tick) 1.2px,transparent 1.7px) 0 0/5px 5px;opacity:.28;-webkit-mask:radial-gradient(circle,#000 50%,transparent 70%);mask:radial-gradient(circle,#000 50%,transparent 70%);pointer-events:none}
#con>:not(.wpm){position:relative;z-index:1}
.sbr{display:flex;flex-wrap:wrap;align-items:center;gap:10px 40px;margin-top:34px;padding:12px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font:400 12px var(--mono);letter-spacing:.14em;color:var(--dim)}
.sbr .c{display:flex;align-items:center;gap:8px;color:var(--text)}
.sbr .btn{margin-left:auto;padding:8px 14px}
.bt{padding:50px 0;font:400 14px/2.1 var(--mono);color:var(--dim)}
.hn{margin-top:64px;font:400 14px var(--mono);letter-spacing:.1em;color:var(--dim)}
.apps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;margin-top:26px}
.apps .app:last-child:nth-child(odd){grid-column:auto}
.app{position:relative;aspect-ratio:1/.85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(5,4,15,.72);color:var(--tick);border:1px solid var(--line2);cursor:pointer;transition:border-color .2s,color .2s}
.app:hover{border-color:var(--line);color:var(--text)}.app:focus-visible,.rw:focus-visible,.bk:focus-visible{outline:2px solid var(--tick);outline-offset:3px}
.app svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.4}
.app .lab{color:var(--text);font-size:12px}
.app .bd{position:absolute;right:12px;top:12px;font:700 10px var(--mono);color:var(--amber);border:1px solid #9c8344;padding:2px 6px}
.ab{display:flex;align-items:center;gap:14px;margin-top:34px;max-width:980px}
.ab b{flex:1;font:700 14px var(--mono);letter-spacing:.14em}
.bk{background:none;color:var(--text);border:1px solid #3a3270;font:700 11px var(--mono);letter-spacing:.12em;padding:8px 12px;cursor:pointer}.bk:hover{border-color:var(--line)}
.ls{max-width:980px;margin-top:18px;border:1px solid var(--line);background:rgba(5,4,15,.6)}
.rw{display:flex;align-items:center;gap:16px;width:100%;text-align:left;color:inherit;font:inherit;background:none;border:0;border-bottom:1px solid var(--line2);padding:20px 22px;cursor:pointer;position:relative}
.rw:last-child{border-bottom:0}.rw:hover{background:#0a0824}.rw:hover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}
.rw .tx{flex:1;min-width:0}.rw b{display:block;margin-top:6px;font:700 18px var(--sans)}
.rw .mt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:400 12px var(--mono);letter-spacing:.08em;color:var(--dim)}
.rpv{max-width:980px;margin-top:22px}.rpv h2{font:700 28px var(--head)}.rpv .m{margin-top:10px;font:400 12px var(--mono);letter-spacing:.1em;color:var(--dim)}
.rpb{margin-top:24px;min-height:320px;border:1px dashed #3a3270;display:grid;place-items:center;text-align:center;padding:24px;font:400 12px/1.9 var(--mono);letter-spacing:.12em;color:var(--dim)}
.in a{color:inherit;text-decoration:none}.in a:hover{color:var(--text)}.in a:focus-visible{outline:2px solid var(--tick);outline-offset:4px}
.in b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ab{margin-top:40px}
.ls0{max-width:980px;margin-top:22px}
.po{display:block;width:100%;text-align:left;color:inherit;font:inherit;background:none;border:0;border-top:1px solid var(--line2);padding:24px 0 28px;cursor:pointer}
.po:first-child{border-top:0;padding-top:0}.po:focus-visible{outline:2px solid var(--tick);outline-offset:4px}
.pa{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.av{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:#0a0824;font:700 16px var(--head);color:var(--tick)}
.pa b{flex:1;font:700 19px var(--head);letter-spacing:.04em}
.pb{position:relative;aspect-ratio:21/8;overflow:hidden;border:1px solid var(--line);background:#150d44;transition:border-color .2s}
.po:hover .pb{border-color:#8f80ff}
.pb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pb::before{content:"";position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(transparent 0 2px,rgba(5,4,15,.3) 2px 3px)}
.pb::after{content:"";position:absolute;inset:0;z-index:1;background:rgba(95,75,215,.3);mix-blend-mode:multiply}
.cp{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:36px 44px 14px 20px;background:linear-gradient(transparent,rgba(5,4,15,.9));font:700 18px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{position:absolute;right:16px;bottom:19px;z-index:4;width:9px;height:9px;background:var(--amber)}
.po .pa,.po .pb{max-width:700px}.po .cp{font-size:16px;padding-top:30px}
/* trang bài đăng Public Account */
.pst{max-width:820px;margin-top:44px}
.pst h2{font:700 30px/1.25 var(--head)}
.pst .by{margin-top:16px;display:flex;align-items:center;gap:12px;font:400 12px var(--mono);letter-spacing:.12em;color:var(--dim)}
.pst .by .av{width:30px;height:30px;font-size:14px}.pst .by b{font:700 17px var(--head);letter-spacing:.04em;color:var(--text)}
.pst .bd2{margin-top:26px;padding-top:26px;border-top:1px solid var(--line2);font:400 16px/1.85 var(--sans);color:#d9d4f5}
.pst .bd2 p{margin-bottom:18px}
.fc{margin-top:46px}
.fc h3{display:flex;align-items:center;gap:14px;font:700 12px var(--mono);letter-spacing:.2em;color:var(--tick)}
.fc h3::after{content:"";flex:1;height:1px;background:var(--line2)}
.cm{border:1px solid var(--line2);padding:16px 18px;margin-top:14px;background:rgba(5,4,15,.6)}
.cm .u{font:700 11px var(--mono);letter-spacing:.14em;color:var(--tick)}.cm p{margin-top:8px;font-size:15px;line-height:1.6}
@media (max-width:900px){.pb{aspect-ratio:16/9}.cp{font-size:15px}.po .pa,.po .pb{max-width:none}}
.in a.on{color:var(--text);font-weight:700}
.rw .tx b:first-child{margin-top:0}
/* lock */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,4,15,.97)}.ov.on{display:flex}
.lg{position:absolute;left:24px;top:calc(18px + env(safe-area-inset-top,0px));font:400 12px/1.7 var(--mono);color:var(--dim);letter-spacing:.06em}
.win{--acc:var(--tick);position:relative;width:min(92vw,440px);background:var(--bg);border:1px solid var(--line)}
.hint{display:flex;justify-content:center;padding-top:26px}
.pad{position:relative;display:grid;grid-template-columns:repeat(3,56px);gap:44px;justify-content:center;padding:26px 0 24px;touch-action:none;user-select:none}
.pad svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.pad line{stroke:var(--acc);stroke-width:3;stroke-dasharray:5 4}.pad .gh{opacity:.4}
.nd{position:relative;z-index:2;width:56px;height:56px;display:grid;place-items:center;border:1px dashed #3a3270;background:var(--bg)}
.nd::before{content:"";width:34px;height:34px;border:1px solid #3a3270}
.nd::after{content:"×";position:absolute;font:400 14px var(--mono);color:#3a3270}
.nd.on{background:var(--acc);border:1px solid var(--acc)}.nd.on::before{border-color:var(--bg)}.nd.on::after{content:"◉";color:var(--bg)}
.st{padding:0 22px 8px;text-align:center;font:400 13px var(--mono);color:var(--dim);min-height:2.2em}
.win .btn{display:block;margin:6px auto 22px}
.win.ok{--acc:var(--amber);border-color:var(--amber)}.win.ok .tb{background:repeating-conic-gradient(#6b5420 0 25%,transparent 0 50%) 0 0/4px 4px}
.win.bad{animation:sh .4s steps(4)}
@keyframes sh{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.pop{display:none;position:absolute;right:-64px;top:36%;z-index:5;width:240px;background:var(--amber);color:#1a1205;border:1px solid var(--amber)}
.pop .tb{border-color:#1a1205;background:repeating-conic-gradient(#b89a4a 0 25%,transparent 0 50%) 0 0/4px 4px}.pop .tb span{background:var(--amber)}
.pop p{padding:16px 14px 20px;font:400 12px/1.6 var(--mono);letter-spacing:.06em}
.win.ok .pop{display:block}
@media (max-width:900px){.apps{grid-template-columns:1fr 1fr;gap:16px}.apps .app:last-child:nth-child(odd){grid-column:1/-1}.rw{padding:16px}.sbr{gap:8px 20px}.sbr .btn{margin-left:0}.en{right:16px;padding:10px 12px}.lg{display:none}.pop{right:-8px;top:42%;width:210px}.in{letter-spacing:.14em}.wrap{padding-top:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="hd"><div class="in" id="crumb"></div></div><div class="en">VI</div>
<main class="wrap">
 <div id="denied"><h1 class="t">Liên lạc</h1><p class="sub">&gt; Truy cập bị khoá. Cần xác thực mẫu hình.<span class="cur"></span></p><button class="btn" id="retry" style="margin-top:30px">[ THỬ LẠI ]</button></div>
 <div id="con"><div class="wpm"></div>
  <h1 class="t">Liên lạc</h1>
    <div id="sc"></div>
 </div>
</main>

<div class="ov" id="ov"><div class="lg" id="lg"></div>
 <div class="win tk" id="win"><div class="tb"><span>VẼ MẪU HÌNH ĐỂ MỞ KHOÁ</span></div>
  <div class="hint" id="hint"></div><div class="pad" id="pad"><svg id="ln"></svg></div><div class="st" id="st"></div>
  <button class="btn" id="cancel">[ HUỶ ]</button>
  <div class="pop"><div class="tb"><span>THÀNH CÔNG</span></div><p>XÁC THỰC THÀNH CÔNG.<br>ĐANG GIẢI MÃ HỒ SƠ</p></div>
 </div></div>

<script>
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,G='▓▒░#@%&01<>/';
function dec(el,t){clearInterval(el._t);if(RM){el.textContent=t;return}let i=0;el._t=setInterval(()=>{i+=1.4;const k=Math.floor(i);el.textContent=t.slice(0,k)+[...t.slice(k)].map(c=>c===' '?' ':G[Math.random()*G.length|0]).join('');if(i>=t.length){clearInterval(el._t);el.textContent=t}},30)}
const IC={
 pub:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>',
 sns:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
 msg:'<svg viewBox="0 0 24 24"><path d="M3 5h18v11H9l-4 4v-4H3z"/><path d="M7 9h10M7 12h6"/></svg>',
 vid:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12"/><path d="M15 10l6-3v10l-6-3z"/></svg>',
 tel:'<svg viewBox="0 0 24 24"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>'};
/* Dữ liệu mẫu: [tên, ngày, thông tin phụ]. Bấm một mẩu sẽ sang trang tái hiện (làm sau). */
const CH=[
 {n:'PUBLIC ACCOUNT',k:'PUB',ic:IC.pub,it:[
  ['Mùa quan sát sao băng đã bắt đầu! Đã đến lúc bứt phá ...','12.2025','↗ 3.4K','Trạm Chuyển Tiếp',['Mùa quan sát sao băng năm nay chính thức khai mạc. Từ tối nay, các điểm quan sát trên tuyến bay sẽ mở cửa đón mọi người.','Hãy chuẩn bị sẵn áo ấm, một chỗ ngồi thoải mái và đừng quên ước một điều ước trước khi ánh sáng cuối cùng tắt đi.']],
  ['Một hồ sơ nhiệm vụ mới vừa được mở khoá ngay hôm nay','01.2026','↗ 2.1K','Bản Tin Đêm Sao',['Hồ sơ nhiệm vụ mới đã được mở khoá và sẵn sàng để đọc. Mỗi chương đều ẩn chứa những manh mối nhỏ về hành trình phía trước.','Chúc bạn có một đêm đọc thật trọn vẹn.']],
  ['Săn ánh hoàng hôn trên đỉnh Greensprings','03.2026','↗ 2.8K','Nhật Ký Nhiệm Vụ',['Sau buổi làm việc dài, không gì tuyệt hơn việc dừng lại ngắm hoàng hôn trên đỉnh đồi. Ánh sáng cam phủ lên những tán lá, nhẹ nhàng như một lời chào.','Đây là điểm dừng chân yêu thích của nhiều người trên tuyến.']]]},
 {n:'SNS',k:'SNS',ic:IC.sns,it:[['Bầu trời sao hôm nay','12.2025','♡ 1.2K'],['Nhiệm vụ mới bắt đầu','01.2026','♡ 980'],['Con phố về đêm','03.2026','♡ 1.5K']]},
 {n:'MESSAGE',k:'MSG',ic:IC.msg,it:[['Lời chúc ngủ ngon','12.2025','24 dòng'],['Trước giờ làm nhiệm vụ','01.2026','18 dòng'],['Ảnh bầu trời đêm','02.2026','9 dòng'],['Chuyện vặt hằng ngày','03.2026','31 dòng']]},
 {n:'VIDEO CALL',k:'VID',ic:IC.vid,it:[['Cuộc gọi đêm khuya','12.2025','00:12:40'],['Cùng xem sao băng','01.2026','00:08:05'],['Chúc mừng sinh nhật','03.2026','00:15:22']]},
 {n:'PHONE CALL',k:'TEL',ic:IC.tel,it:[['Giọng nói trước khi ngủ','12.2025','00:03:10'],['Báo bình an','02.2026','00:01:45'],['Hát cho em nghe','04.2026','00:05:30']]}];
const PH=['inset 0 0 0 16px #05040f','inset -11px 0 0 #05040f','inset -6px 0 0 #05040f','none','inset 6px 0 0 #05040f','inset 11px 0 0 #05040f'];
const p2=n=>String(n).padStart(2,'0'),p3=n=>String(n).padStart(3,'0');
function crumb(a,ll){const el=$('#crumb');el.innerHTML=a.map((s,i)=>i===a.length-1&&!ll?`<b>${s}</b>`:i===0?s:`<a href="#" data-i="${i}"${i===a.length-1?' class="on"':''}>${s}</a>`).join('<i>&gt;</i>');
 el.querySelectorAll('a').forEach(l=>l.onclick=e=>{e.preventDefault();+l.dataset.i===1?home():app(ci)})}
const PUBIMG=["/* ảnh mẫu đã lược bỏ */","/* ảnh mẫu đã lược bỏ */","/* ảnh mẫu đã lược bỏ */"];
let ci=0,tmb=[];
function home(){crumb(['MOONSTRIDE','CONTACT']);
 $('#sc').innerHTML=`<div class="hn">&gt; chạm một ứng dụng để mở</div><div class="apps">${CH.map((c,i)=>`<button class="app tk" data-i="${i}"><span class="bd">${p2(c.it.length)}</span>${c.ic}<span class="lab">${c.n}</span></button>`).join('')}</div>`;
 $('#sc').querySelectorAll('.app').forEach(b=>b.onclick=()=>app(+b.dataset.i))}
function app(i){ci=i;const c=CH[i];crumb(['MOONSTRIDE','CONTACT',c.n]);
 const head=`<div class="ab"><b>${c.n}</b><span class="pill">${p2(c.it.length)}</span></div>`;
 $('#sc').innerHTML=head+(c.k==='PUB'
  ?'<div class="ls0">'+c.it.map((m,j)=>`<button class="po" data-j="${j}"><div class="pa"><span class="av">${m[3][0]}</span><b>${m[3]}</b><span class="lab">${m[1]}</span></div><div class="pb"><img src="${PUBIMG[j%3]}" alt=""><div class="cp">${m[0]}</div>${j<2?'<i class="dt"></i>':''}</div></button>`).join('')+'</div>'
  :'<div class="ls tk">'+c.it.map((m,j)=>`<button class="rw" data-j="${j}"><i class="mn" style="--sh:${PH[j%6]}"></i><span class="tx">${['VID','TEL','MSG'].includes(c.k)?'':`<span class="lab">${c.k} // ${p3(j+1)}</span>`}<b>${m[0]}</b></span><span class="mt"><span>${m[1]}</span><span>${m[2]}</span></span></button>`).join('')+'</div>');
 $('#sc').querySelectorAll('.rw,.po').forEach(r=>r.onclick=()=>replay(+r.dataset.j));scrollTo(0,0)}
const CM=[['@nguoi_dung_01','Tuyệt quá, cuối cùng cũng được xem bản tin này!'],['@sao_bang','Đọc xong mà háo hức muốn vào ngay.'],['@dem_trang','Ảnh minh hoạ đẹp thật, mong có thêm bài như vậy.']];
function replay(j){const c=CH[ci],m=c.it[j];crumb(['MOONSTRIDE','CONTACT',c.n],true);
 $('#sc').innerHTML=c.k==='PUB'
  ?`<div class="pst"><h2>${m[0]}</h2><div class="by"><span class="av">${m[3][0]}</span><b>${m[3]}</b><span>${m[1]}</span></div><div class="bd2">${m[4].map(p=>`<p>${p}</p>`).join('')}</div><div class="fc"><h3>FEATURED COMMENTS</h3>${CM.map(x=>`<div class="cm"><div class="u">${x[0]}</div><p>${x[1]}</p></div>`).join('')}</div></div>`
  :`<div class="ab"><b>${c.k} // ${p3(j+1)}</b></div><div class="rpv"><h2>${m[0]}</h2><div class="m">${m[1]} · ${m[2]}</div><div class="rpb">[ TRANG TÁI HIỆN ]<br>nội dung sẽ được thêm vào sau</div></div>`;
 scrollTo(0,0)}
function boot(){tmb.forEach(clearTimeout);crumb(['MOONSTRIDE','CONTACT']);if(RM){home();return}
 const L=['> KHỞI ĐỘNG THIẾT BỊ [OK]','> KẾT NỐI RELAY // XAVIER [OK]','> ĐỒNG BỘ DỮ LIỆU [OK]'];$('#sc').innerHTML='<div class="bt" id="bt"></div>';
 tmb=L.map((t,i)=>setTimeout(()=>{$('#bt').innerHTML+=t+'<br>'},i*300));tmb.push(setTimeout(home,1250))}
function enter(){$('#denied').style.display='none';$('#con').style.display='block';boot();scrollTo(0,0)}
$('#retry').onclick=()=>{$('#denied').style.display='none';openLock()};

/* khoá mẫu hình chữ S: hiện đầu tiên khi vào trang Contact */
let unlocked=false;const SEQ=[2,1,0,3,4,5,8,7,6];
const pad=$('#pad'),ln=$('#ln'),win=$('#win'),st=$('#st'),nds=[];
for(let i=0;i<9;i++){const n=document.createElement('div');n.className='nd';pad.appendChild(n);nds.push(n)}
(function(){const P=i=>[10+(i%3)*20,10+Math.floor(i/3)*20];let s='<svg width="62" height="62" viewBox="0 0 62 62">';
 for(let i=0;i<9;i++){const[x,y]=P(i);s+=`<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="none" stroke="#7f77b8"/>`}
 $('#hint').innerHTML=s+'<polyline fill="none" stroke="#a99cff" stroke-width="2" points="'+SEQ.map(i=>P(i).join(',')).join(' ')+'"/></svg>'})();
let path=[],drag=false,done=false,pt=null;
const C=i=>[nds[i].offsetLeft+28,nds[i].offsetTop+28];
function draw(){let h='';for(let k=1;k<path.length;k++){const a=C(path[k-1]),b=C(path[k]);h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`}
 if(drag&&pt&&path.length){const a=C(path[path.length-1]);h+=`<line class="gh" x1="${a[0]}" y1="${a[1]}" x2="${pt[0]}" y2="${pt[1]}"/>`}ln.innerHTML=h}
function reset(){path=[];done=false;drag=false;pt=null;win.classList.remove('ok','bad');nds.forEach(n=>n.classList.remove('on'));st.textContent='> vẽ chữ S để mở khoá';draw()}
function mv(e){if(!drag)return;const r=pad.getBoundingClientRect();pt=[e.clientX-r.left,e.clientY-r.top];
 nds.forEach((n,i)=>{const c=C(i);if(!path.includes(i)&&Math.hypot(pt[0]-c[0],pt[1]-c[1])<30){path.push(i);n.classList.add('on')}});draw()}
pad.onpointerdown=e=>{if(done)return;reset();drag=true;pad.setPointerCapture(e.pointerId);mv(e)};
pad.onpointermove=mv;
pad.onpointerup=pad.onpointercancel=()=>{if(!drag)return;drag=false;pt=null;draw();
 if(path.length<2){reset();return}
 const ok=path.length===9&&(path.every((v,i)=>v===SEQ[i])||path.every((v,i)=>v===SEQ[8-i]));
 if(ok){done=true;win.classList.add('ok');st.textContent='> mẫu hình khớp // truy cập được cấp';unlocked=true;setTimeout(()=>{closeLock();enter()},1700)}
 else{win.classList.add('bad');st.textContent='> mẫu hình không khớp';setTimeout(reset,650)}};
const LOG=['KHỞI TẠO KÊNH LIÊN LẠC [HOÀN TẤT]','TẢI MÔ-ĐUN KHOÁ MÀN HÌNH [HOÀN TẤT]','DỰNG GIAO DIỆN ĐỒ HOẠ [HOÀN TẤT]','QUÉT CÁC NÚT [HOÀN TẤT]'];let tm=[];
function openLock(){reset();crumb(['MOONSTRIDE','CONTACT']);$('#ov').classList.add('on');$('#lg').innerHTML='';tm.forEach(clearTimeout);tm=LOG.map((t,i)=>setTimeout(()=>{$('#lg').innerHTML+=t+'<br>'},i*220))}
function closeLock(){tm.forEach(clearTimeout);$('#ov').classList.remove('on');reset()}
$('#cancel').onclick=()=>{closeLock();if(!unlocked)$('#denied').style.display='block'};
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))$('#cancel').click()});
openLock();
</script>
</body>
</html>
