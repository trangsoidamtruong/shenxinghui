<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return originalFetch;
            },
            set: function (val) {
              if (typeof val === 'function') {
                originalFetch = val;
              }
            }
          });
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trăng Soi Dặm Trường</title>
    <meta name="description" content="Giao diện màn hình chính phong cách game PC sci-fi với video nền lặp vô tận và hiệu ứng mưa sao băng từ phải sang trái." />
